# pyproject.toml
[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "kerno"
version     = "0.1.0"
description = "A kernel-native agent runtime. Brain meets body."
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "jupyter-client>=8.0",
    "nbformat>=5.9",
    "ipykernel>=6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.20"]
openai    = ["openai>=1.0"]
sql       = ["sqlalchemy>=2.0"]
security  = []
all       = [
    "anthropic>=0.20",
    "openai>=1.0",
    "sqlalchemy>=2.0",
    "psutil>=5.9",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-timeout",
    "anthropic>=0.20",
]

[project.scripts]
kerno = "kerno.cli.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout      = 120
markers      = ["integration: requires a running kernel"]

[[tool.hatch.build.targets.wheel]]
packages = ["kerno"]
