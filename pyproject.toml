# pyproject.toml
#
# Kerno is split into a LEAN CORE plus OPTIONAL PACKS (audit #16):
#
#   pip install kerno             → kernel runtime + agent loops only
#   pip install "kerno[data]"     → + pandas/numpy/matplotlib/sklearn/
#                                    scipy/openpyxl (analytical skills)
#   pip install "kerno[server]"   → + fastapi/uvicorn (HTTP + OpenAI API)
#   pip install "kerno[all]"      → everything
#
# The core itself never imports the data stack on the host: the analytical
# libraries run INSIDE the Jupyter kernel (skills are kernel-side code),
# so a minimal install stays small.

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "kerno"
version     = "0.2.1-dev"
description = "A kernel-native agent runtime. Brain meets body."
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.11"

# ── Core: the runtime itself ──────────────────────────────────────────────────
# The kernel runtime, agent loops, execution engine, security layers,
# persistence, and CLI — no analytical stack required on the host.
dependencies = [
    "jupyter-client>=8.0",
    "nbformat>=5.9",
    "ipykernel>=6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# ── Optional packs (audit #16: the analytical ecosystem is NOT core) ─────────

# Analytical data stack — required for the data/viz/ML/stats skills to
# load inside the kernel, and for pandas-based host helpers.
data = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "openpyxl>=3.1",
]

# HTTP / OpenAI-compatible server surfaces.
server = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "httpx>=0.24",
    "requests>=2.31",
]

# LLM providers.
anthropic = ["anthropic>=0.20"]
openai    = ["openai>=1.0"]

# Skill-pack extras.
sql        = ["sqlalchemy>=2.0"]
timeseries = ["statsmodels>=0.14"]
nlp        = ["nltk>=3.8"]
graphs     = ["networkx>=3.1"]
documents  = ["pdfplumber>=0.10", "python-docx>=1.1"]
security   = ["psutil>=5.9"]

# Everything.
all = [
    "anthropic>=0.20",
    "openai>=1.0",
    "sqlalchemy>=2.0",
    "psutil>=5.9",
    "statsmodels>=0.14",
    "nltk>=3.8",
    "networkx>=3.1",
    "pdfplumber>=0.10",
    "python-docx>=1.1",
    "tabulate>=0.9",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "httpx>=0.24",
    "requests>=2.31",
    # the data stack
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "openpyxl>=3.1",
]

# Test/development: the data stack + server + providers + test tools.
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-timeout",
    "hypothesis>=6.0",      # property-based tests (tests/property/)
    "httpx>=0.24",          # server integration tests + TestClient
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "openai>=1.0",
    "anthropic>=0.20",
    "statsmodels>=0.14",
    "networkx>=3.1",
    "tabulate>=0.9",
    "psutil>=5.9",
    # the data stack (the test suite exercises the analytical skills)
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "openpyxl>=3.1",
]

[project.scripts]
kerno = "kerno.cli.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Real-kernel tests under heavy shared-sandbox load occasionally exceed
# 120s (observed load flakes). 300s keeps the gate honest without false
# timeouts; each individual test still runs in seconds in isolation.
timeout      = 300
markers      = ["integration: requires a running kernel"]

[tool.hatch.build.targets.wheel]
packages = ["kerno"]
