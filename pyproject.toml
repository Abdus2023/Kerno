# pyproject.toml
[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "kerno"
version     = "0.1.0"
description = "A kernel-native agent runtime. Brain meets body."
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "jupyter-client>=8.0",
    "nbformat>=5.9",
    "ipykernel>=6.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.20"]
openai    = ["openai>=1.0"]
sql       = ["sqlalchemy>=2.0"]
timeseries = ["statsmodels>=0.14"]
nlp       = ["nltk>=3.8"]
graphs    = ["networkx>=3.1"]
documents = ["pdfplumber>=0.10", "python-docx>=1.1"]
security  = []
all       = [
    "anthropic>=0.20",
    "openai>=1.0",
    "sqlalchemy>=2.0",
    "psutil>=5.9",
    "statsmodels>=0.14",
    "nltk>=3.8",
    "networkx>=3.1",
    "pdfplumber>=0.10",
    "python-docx>=1.1",
    "tabulate>=0.9",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-timeout",
    "anthropic>=0.20",
    "statsmodels>=0.14",
    "networkx>=3.1",
    "tabulate>=0.9",
]

[project.scripts]
kerno = "kerno.cli.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout      = 120
markers      = ["integration: requires a running kernel"]

[[tool.hatch.build.targets.wheel]]
packages = ["kerno"]
