name: Kerno Remediation Gate

on:
  pull_request:
    branches:
      - 'arena/**'
  push:
    branches:
      - 'remediation/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Compile Python sources
        run: python -m compileall -q kerno tests

      - name: Run security regression tests
        run: python -m pytest -q tests/security/test_allowlist_introspection.py

      - name: Run full test suite
        run: python -m pytest -q
