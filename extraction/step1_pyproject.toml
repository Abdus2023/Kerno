# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "[hatchling.build](http://hatchling.build)"

[project]
name = "kerno"
version = "0.1.0"
description = "A kernel-native agent runtime. Brain meets body."
requires-python = ">=3.11"

dependencies = [
    "jupyter-client>=8.0",
    "nbformat>=5.9",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-timeout",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
